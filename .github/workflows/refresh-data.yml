name: Refresh GitHub snapshot

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: github-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Collect public repositories and preserve today's baseline
        run: npm run data:refresh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test
      - name: Prepare daily social drafts when a public origin is configured
        if: vars.SITE_URL != ''
        run: npm run posts:prepare
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Save refreshed data
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data.json data/history/ data/announcements.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh GitHub snapshot and daily history'
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not trigger push workflows, so publish the new
      # snapshot by explicitly running the same pipeline a human push would.
      - name: Validate and deploy the refreshed snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
